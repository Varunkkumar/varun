<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Isometric plate of Varun's projects: a car with an alarm beacon, a voice-controlled rover, a server rack and a sealed crate marked patent pending.">
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="600"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  * { vector-effect: non-scaling-stroke; }
  .bg { fill: #0a0f14; }
  .face rect, .tyre { fill: #131b22; stroke: #5d7383; stroke-width: 1; }
  .face rect.top { fill: #18222b; } .face rect.side { fill: #0f161c; }
  .detail { fill: none; stroke: #22303b; stroke-width: 1; }
  .glass { fill: #0f161c; stroke: #22303b; stroke-width: 1; }
  .wire { fill: none; stroke: #5d7383; stroke-width: 1.2; }
  .pulse { fill: none; stroke: #2dd4bf; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 86; animation: run 2.4s linear infinite; }
  @keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  .beacon rect { animation: blink 1.2s steps(1) infinite; }
  .bt rect { animation: blink 1.5s steps(1) infinite; }
  .phone { animation: lit 2.4s ease-in-out infinite; }
  .lid rect { animation: seam 3s ease-in-out infinite; }
  @keyframes blink { 0%, 49% { fill: #2dd4bf; stroke: #2dd4bf; } 50%, 100% { fill: #131b22; } }
  @keyframes lit { 0%, 55% { fill: #0f161c; } 70%, 100% { fill: #2dd4bf; } }
  @keyframes seam { 0%, 100% { stroke: #5d7383; } 50% { stroke: #2dd4bf; } }
  .stopline { fill: none; stroke: #2dd4bf; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .bar { fill: #2dd4bf; }
.bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(.7); }
.b0 { animation: bk0 2s linear infinite; }
@keyframes bk0 { 0% { transform: scaleX(0.292); } 25% { transform: scaleX(0.833); } 50% { transform: scaleX(0.458); } 75% { transform: scaleX(1.000); } 100% { transform: scaleX(0.292); } }
.b1 { animation: bk1 3s linear infinite; }
@keyframes bk1 { 0% { transform: scaleX(0.542); } 25% { transform: scaleX(0.625); } 50% { transform: scaleX(0.708); } 75% { transform: scaleX(0.583); } 100% { transform: scaleX(0.542); } }
.b2 { animation: bk2 4s linear infinite; }
@keyframes bk2 { 0% { transform: scaleX(0.750); } 25% { transform: scaleX(0.771); } 50% { transform: scaleX(0.750); } 75% { transform: scaleX(0.792); } 100% { transform: scaleX(0.750); } }
.rover { transform-box: view-box; animation: drive 6s linear infinite; }
@keyframes drive { 0%, 100% { transform: translate(0px, 0px); } 40%, 60% { transform: translate(105.7px, 61.0px); } 95% { transform: translate(0px, 0px); } }

  .pulse, .bar, .stopline, .beacon rect, .bt rect, .phone { filter: url(#glow); }
  .scr { fill: #0a0f14; font: 700 7px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .label { fill: #71828f; font: 700 8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .8px; }
  .name { fill: #d5e0e8; font: 600 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -0.5px; }
  .sub { fill: #71828f; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .acc { fill: #2dd4bf; }
  .fig { fill: #71828f; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
