<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Guardian Wheels: gsm · bluetooth · android">
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="-400" y="-400" width="1200" height="1000"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  * { vector-effect: non-scaling-stroke; }
  .face rect, .tyre { fill: #131b22; stroke: #5d7383; stroke-width: 1; }
  .face rect.top { fill: #18222b; } .face rect.side { fill: #0f161c; }
  .acc rect, .acc rect.top, .acc rect.side { fill: #2dd4bf; stroke: #2dd4bf; }
  .detail { fill: none; stroke: #22303b; stroke-width: 1; }
  .glass { fill: #0f161c; stroke: #22303b; stroke-width: 1; }
  .wire { fill: none; stroke: #5d7383; stroke-width: 1.2; }
  .pulse { fill: none; stroke: #2dd4bf; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 86; animation: run 2.4s linear infinite; animation-delay: var(--d, 0s); }
  .atk { stroke-dasharray: 8 92; stroke-width: 3; animation-duration: .9s; }
  @keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  .blink rect { animation: blink 1.4s steps(1) infinite; animation-delay: var(--d, 0s); }
  @keyframes blink { 0%, 49% { fill: #2dd4bf; stroke: #2dd4bf; } 50%, 100% { fill: #131b22; } }
  .dotc { fill: #131b22; stroke: #5d7383; stroke-width: 1; animation: dot 2s steps(1) infinite; animation-delay: var(--d, 0s); }
  @keyframes dot { 0%, 20% { fill: #2dd4bf; stroke: #2dd4bf; } 21%, 100% { fill: #131b22; stroke: #5d7383; } }
  .phone { animation: lit 2.4s ease-in-out infinite; }
  @keyframes lit { 0%, 55% { fill: #0f161c; } 70%, 100% { fill: #2dd4bf; } }
  .stopline { fill: none; stroke: #2dd4bf; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .bar { fill: #2dd4bf; }
  .chk { fill: none; stroke: #5d7383; stroke-width: 1; }
  .chkf { fill: #2dd4bf; opacity: 1; animation: fillin 3.2s linear infinite both; animation-delay: var(--d, 0s); }
  @keyframes fillin { 0%, 15% { opacity: 0; } 25%, 80% { opacity: 1; } 95%, 100% { opacity: 0; } }
  .water { fill: #2dd4bf; fill-opacity: .25; stroke: #2dd4bf; stroke-width: 1.2; }
  .draw { fill: none; stroke: #2dd4bf; stroke-width: 1.6; stroke-dasharray: 100; animation: draw 4s ease-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 100; } 70%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
  .pulse, .bar, .stopline, .blink rect, .dotc, .phone, .draw, .acc rect, .chkf, .water { filter: url(#glow); }
  .fig { fill: #71828f; font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
  .chip { fill: #d5e0e8; font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .title { fill: #d5e0e8; font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tag { fill: #71828f; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
