<rect x="262" y="9" width="84" height="19" rx="9.5" fill="none" stroke="#2dd4bf" stroke-width="1"/><text class="chip" x="304.0" y="22" text-anchor="middle">live in 3d ▸</text>
<g transform="translate(138.6 71.3) scale(0.9560)">
<g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 0.00 -13.00)" width="180" height="80"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -69.28 27.00)" width="180" height="3"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 86.60 117.00)" width="80" height="3"/></g>
<g transform="matrix(0.8660 0.5000 -0.8660 0.5000 0.00 -3.00)"><line class="stopline" x1="115" y1="0" x2="115" y2="60"/></g>
<g class="rover"><g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 -12.12 -6.00)" width="40" height="30"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -38.11 9.00)" width="40" height="10"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 -3.46 29.00)" width="30" height="10"/></g><g class="face blink"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 -8.66 -2.00)" width="16" height="18"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -24.25 7.00)" width="16" height="4"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 -10.39 15.00)" width="18" height="4"/></g></g>
<g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 129.90 46.00)" width="8" height="60"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 77.94 76.00)" width="8" height="26"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 84.87 80.00)" width="60" height="26"/></g>
</g>
<text class="title" x="14" y="206">Voice car</text>
<text class="tag" x="14" y="224">arduino · voice · bluetooth</text>
