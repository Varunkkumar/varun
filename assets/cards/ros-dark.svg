<g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 0.00 -16.00)" width="100" height="100"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -86.60 34.00)" width="100" height="16"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 0.00 84.00)" width="100" height="16"/></g>
<g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 0.00 9.00)" width="30" height="30"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -25.98 24.00)" width="30" height="10"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 0.00 39.00)" width="30" height="10"/></g>
