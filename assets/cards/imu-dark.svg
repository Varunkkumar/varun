<g class="rock"><g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 0.00 -8.00)" width="100" height="70"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -60.62 27.00)" width="100" height="4"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 25.98 77.00)" width="70" height="4"/></g><g transform="matrix(0.8660 0.5000 -0.8660 0.5000 0.00 -8.00)"><line class="detail" x1="10" y1="55" x2="90" y2="55"/><line class="detail" x1="10" y1="62" x2="60" y2="62"/><line class="detail" x1="43" y1="29" x2="60" y2="29"/></g><g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 0.87 0.50)" width="28" height="28"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -23.38 14.50)" width="28" height="6"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 0.87 28.50)" width="28" height="6"/></g><g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 34.64 28.00)" width="18" height="18"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 19.05 37.00)" width="18" height="4"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 34.64 46.00)" width="18" height="4"/></g><g class="face blink"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 24.25 55.00)" width="8" height="8"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 17.32 59.00)" width="8" height="3"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 24.25 63.00)" width="8" height="3"/></g></g>
