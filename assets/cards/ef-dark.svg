<g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 8.66 -5.00)" width="36" height="28"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 -15.59 9.00)" width="36" height="14"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 15.59 27.00)" width="28" height="14"/></g>
<g class="face"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 45.03 -0.00)" width="4" height="4"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 41.57 2.00)" width="4" height="42"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 45.03 4.00)" width="4" height="42"/></g>
<g class="face blink"><rect class="top" transform="matrix(0.8660 0.5000 -0.8660 0.5000 45.03 -8.00)" width="14" height="14"/><rect transform="matrix(0.8660 0.5000 0.0000 1.0000 32.91 -1.00)" width="14" height="3"/><rect class="side" transform="matrix(0.8660 -0.5000 0.0000 1.0000 45.03 6.00)" width="14" height="3"/></g>
