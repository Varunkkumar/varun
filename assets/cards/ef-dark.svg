<path class="wire" d="M-51.1,28.5 L-68.4,18.5 L-77.9,8.0"/><path class="pulse" style="--d:0.4s" pathLength="100" d="M-51.1,28.5 L-68.4,18.5 L-77.9,8.0"/>
